# Builds the double-click Windows app, self-tests it on Windows, and publishes the installer as a GitHub Release.
name: Windows app

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Stamp the version (the app compares it with the latest release to offer updates)
        shell: pwsh
        run: Set-Content -Path ucsim/_build_version.py -Value 'VERSION = "0.1.${{ github.run_number }}"'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pywebview pillow

      - name: Build the workstation UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package with PyInstaller
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/ucsim.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the packaged app on Windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ProvoOremSimulator\ProvoOremSimulator.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content "$env:LOCALAPPDATA\ProvoOremSimulator\simulator.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Build the installer
        shell: pwsh
        run: |
          $env:APP_VERSION = "0.1.${{ github.run_number }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Compress-Archive -Path dist\ProvoOremSimulator -DestinationPath dist\ProvoOremSimulator-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ProvoOremSimulator-windows
          path: dist/ProvoOremSimulator-Setup.exe
          retention-days: 14

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Provo-Orem Social Simulator 0.1.${{ github.run_number }} for Windows
          make_latest: true
          body: |
            **To install:** download `ProvoOremSimulator-Setup.exe` below and double-click it. It installs for your
            user only (no admin rights needed) and adds Start-menu and desktop shortcuts.

            Windows may show "Windows protected your PC" because the app isn't code-signed: click
            **More info → Run anyway**.

            No-install alternative: download `ProvoOremSimulator-portable.zip`, extract it, and double-click
            `ProvoOremSimulator.exe` inside the folder.

            Built from ${{ github.sha }} on branch ${{ github.ref_name }}.
          files: |
            dist/ProvoOremSimulator-Setup.exe
            dist/ProvoOremSimulator-portable.zip
