[project]
name = "ucsim"
version = "0.1.0"
description = "Utah County College Social Simulator - an evidence-grounded, event-driven social microsimulation of the BYU/UVU ecosystem"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "polars>=1.0",
  "pyarrow>=15",
  "duckdb>=1.0",
  "scipy>=1.11",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
geo = ["requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ucsim*"]

[tool.setuptools.package-data]
ucsim = ["config/*.yaml", "priors/*.json", "geo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
