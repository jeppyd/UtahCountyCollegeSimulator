# School decisions (engine/systems/academics.py, at the end of each term). Field meanings: config/decisions/00_core.yaml.
decisions:
  drop_out:
    label: Whether to leave school (end of term)
    units: logit
    outcomes: [dropped_out]
    factors:
      base:          {label: "how rarely students leave in a given term", more: "", less: "most students stay enrolled"}
      school:        {label: "which school (UVU students, many working and commuting, leave more often)", more: "UVU student", less: ""}
      grades:        {label: "a GPA under 2.0 this term", more: "grades were failing", less: ""}
      money:         {label: "money pressure", more: "money was tight", less: ""}
      children:      {label: "being a mother of young children", more: "caring for children", less: ""}
      self_efficacy: {label: "confidence in their ability to do the work", more: "doubted they could do it", less: "confident in their schoolwork"}
  term_grades:
    label: How the term's grades came out
    units: grade_points
    outcomes: [below_a_B, B_or_better]
    positive: B_or_better
    factors:
      base:              {label: "a typical student's term GPA", more: "", less: ""}
      ability:           {label: "academic ability", more: "strong academically", less: "school comes harder to them"}
      conscientiousness: {label: "conscientiousness", more: "organized and diligent", less: "not very organized"}
      study:             {label: "hours of study a week", more: "studied a lot", less: "studied little"}
      attendance:        {label: "how often they went to class", more: "went to class", less: "skipped class"}
      fatigue:           {label: "fatigue", more: "", less: "worn out"}
      depression:        {label: "a depressive episode", more: "", less: "depressed during the term"}
      stress:            {label: "stress", more: "", less: "stressed"}
      sleep:             {label: "sleep", more: "slept enough", less: "short on sleep"}
      luck:              {label: "luck (exams, graders, everything the model does not follow)", more: "good luck", less: "bad luck"}
  change_major:
    label: Whether to change majors (end of term)
    units: probability
    outcomes: [changed]
    factors:
      base: {label: "the share of early students who switch majors in a term (the model has no reasons for which ones)", more: "chance", less: ""}
  finish_degree:
    label: Whether a graduate student finishes this term
    units: probability
    outcomes: [finished]
    factors:
      base: {label: "the share of graduate students who finish in a given term (the model has no reasons for which ones)", more: "chance", less: ""}
