# Event-type registry. `effects` are transient impulses on composed emotional states:
#   mag        base magnitude (state units, 0-1 scale)          sd    lognormal spread of |mag| (individual variation)
#   half_life  days for the effect to halve                      delay days before it starts
#   mods       multiplicative moderators: mag *= exp(Σ β·z). Keys are person variables (z-scored at
#              runtime) or event attributes prefixed `ev.` supplied by the emitting system.
# Salience controls retention in an agent's life-history memory (≥0.5 shown on the timeline).
events:
  # ------------------------------------------------------------------ social
  new_friend:
    label: Became friends
    story: "{a} and {b} became friends"
    category: social
    salience: 0.55
    effects:
      - {var: loneliness, mag: -0.03, sd: 0.3, half_life: 20}
      - {var: belonging, mag: 0.03, sd: 0.3, half_life: 20}
    evidence: literature
    refs: ["Hall (2019) J Soc Pers Relat: hours needed to form friendships"]
  close_friend:
    label: Became close friends
    story: "{a} and {b} became close friends"
    category: social
    salience: 0.7
    effects:
      - {var: loneliness, mag: -0.05, sd: 0.3, half_life: 45}
      - {var: mood, mag: 0.03, sd: 0.3, half_life: 20}
    evidence: literature
  friendship_faded:
    label: Close friendship faded
    story: "{a} and {b} drifted apart"
    category: social
    salience: 0.55
    effects:
      - {var: loneliness, mag: 0.03, sd: 0.4, half_life: 25, mods: {neuroticism: 0.2}}
    evidence: hypothetical
  conflict:
    label: Interpersonal conflict
    story: "{a} had a falling-out with {b}"
    category: social
    salience: 0.4
    effects:
      - {var: stress, mag: 0.06, sd: 0.4, half_life: 4, mods: {neuroticism: 0.3, agreeableness: -0.15}}
      - {var: mood, mag: -0.05, sd: 0.4, half_life: 3}
    evidence: literature
  coping_started:
    label: Started coping with a hard time
    story: "{a} started coping with a hard stretch"
    category: coping
    salience: 0.4
    effects: []
    evidence: structural
    desc: "Value = strategy (1 support, 2 active, 3 religious, 4 distraction, 5 withdrawal). Cause = the most salient recent negative memory."
  coping_ended:
    label: A hard stretch eased
    story: "{a} came through a hard stretch"
    category: coping
    salience: 0.35
    effects: []
    evidence: structural
    desc: "Value = outcome (0-1): how much the strain fell, credited to the strategy used."
  hosted_gathering:
    label: Hosted a get-together
    story: "{a} hosted a get-together"
    category: social
    salience: 0.35
    effects:
      - {var: belonging, mag: 0.03, sd: 0.3, half_life: 6}
      - {var: mood, mag: 0.02, sd: 0.4, half_life: 2}
    evidence: hypothetical
  # ------------------------------------------------------------------ romance
  asked_out:
