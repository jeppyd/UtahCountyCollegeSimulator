# Event-type registry. `effects` are transient impulses on composed emotional states:
#   mag        base magnitude (state units, 0-1 scale)          sd    lognormal spread of |mag| (individual variation)
#   half_life  days for the effect to halve                      delay days before it starts
#   mods       multiplicative moderators: mag *= exp(Σ β·z). Keys are person variables (z-scored at
#              runtime) or event attributes prefixed `ev.` supplied by the emitting system.
# Salience controls retention in an agent's life-history memory (≥0.5 shown on the timeline).
events:
  # ------------------------------------------------------------------ social
  new_friend:
    label: Became friends
    category: social
    salience: 0.55
    effects:
      - {var: loneliness, mag: -0.03, sd: 0.3, half_life: 20}
      - {var: belonging, mag: 0.03, sd: 0.3, half_life: 20}
    evidence: literature
    refs: ["Hall (2019) J Soc Pers Relat: hours needed to form friendships"]
  close_friend:
    label: Became close friends
    category: social
    salience: 0.7
    effects:
      - {var: loneliness, mag: -0.05, sd: 0.3, half_life: 45}
      - {var: mood, mag: 0.03, sd: 0.3, half_life: 20}
    evidence: literature
  friendship_faded:
    label: Close friendship faded
    category: social
    salience: 0.55
    effects:
      - {var: loneliness, mag: 0.03, sd: 0.4, half_life: 25, mods: {neuroticism: 0.2}}
    evidence: hypothetical
  conflict:
    label: Interpersonal conflict
    category: social
    salience: 0.4
    effects:
      - {var: stress, mag: 0.06, sd: 0.4, half_life: 4, mods: {neuroticism: 0.3, agreeableness: -0.15}}
      - {var: mood, mag: -0.05, sd: 0.4, half_life: 3}
    evidence: literature
  hosted_gathering:
