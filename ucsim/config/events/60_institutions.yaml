# Events from engine/systems/institutions.py. Same fields as events.yaml; magnitudes hypothetical.
events:
  club_changed_plans:
    label: Club officers changed plans
    story: "{a}'s club changed its plans after low turnout"
    category: social
    salience: 0.3
    effects: []
    evidence: hypothetical
    desc: "The value says what they did: 0 added food, 1 moved to another night, 2 recruited, 3 capped the room."
  joined_group:
    label: Joined a club or team
    story: "{a} joined a club after being recruited"
    category: social
    salience: 0.35
    effects:
      - {var: belonging, mag: 0.01, sd: 0.4, half_life: 14}
    evidence: hypothetical
  waiting_for_bishop:
    label: Waiting to see the bishop
    story: "{a} is waiting for a slot with their bishop"
    category: religion
    salience: 0.2
    effects:
      - {var: stress, mag: 0.01, sd: 0.4, half_life: 5}
    evidence: hypothetical
  sought_counseling:
    label: Asked for counseling
    story: "{a} asked the campus counseling center for help"
    category: health
    salience: 0.6
    effects: []
    evidence: hypothetical
  counseling_started:
    label: Started counseling
    story: "{a} started seeing a counselor"
    category: health
    salience: 0.6
    effects:
      - {var: stress, mag: -0.02, sd: 0.4, half_life: 10}
    evidence: hypothetical
    desc: "The value is how many days they waited."
  counseling_session:
    label: Counseling session
    story: "{a} had a counseling session"
    category: health
    salience: 0.15
    effects:
      - {var: mood, mag: 0.02, sd: 0.5, half_life: 7}
      - {var: stress, mag: -0.015, sd: 0.5, half_life: 7}
    evidence: hypothetical
    refs: ["Brief therapy in college counseling centers: modest average improvement over a handful of sessions (CCMH)"]
  gave_up_waiting:
    label: Gave up waiting for counseling
    story: "{a} gave up waiting for a counseling appointment"
    category: health
    salience: 0.45
    effects:
      - {var: mood, mag: -0.02, sd: 0.4, half_life: 7}
    evidence: hypothetical
    desc: "The value is how many days they had waited."
  recommend_withheld:
    label: Temple recommend held back
    story: "{a}'s bishop asked them to hold off on the temple (and, for a while, the sacrament) as they repent"
    category: religion
    salience: 0.6
    effects:
      - {var: stress, mag: 0.04, sd: 0.5, half_life: 10}
      - {var: belonging, mag: -0.03, sd: 0.6, half_life: 21, mods: {sexual_shame: 0.5}}
    evidence: hypothetical
    desc: "After confessing premarital sex: no temple recommend for a few weeks, often no sacrament too. The value is the number of weeks. Some go to church less while it lasts, so others don't see them pass the sacrament tray."
  recommend_restored:
    label: Temple recommend restored
    story: "{a} can go to the temple again after meeting with their bishop"
    category: religion
    salience: 0.45
    effects:
      - {var: guilt, mag: -0.06, sd: 0.4, half_life: 21}
      - {var: belonging, mag: 0.03, sd: 0.5, half_life: 21}
    evidence: hypothetical
  bishop_followup:
    label: Follow-up meeting with the bishop
    story: "{a} met with their bishop again, as they do about once a month"
    category: religion
    salience: 0.3
    effects:
      - {var: guilt, mag: -0.03, sd: 0.4, half_life: 14}
      - {var: stress, mag: 0.01, sd: 0.5, half_life: 5}
    evidence: hypothetical
    desc: "Regular check-ins (about monthly) while someone works through an ongoing issue such as pornography, or after a serious confession. The value says what about: 1 pornography, 2 masturbation, 3 premarital sex."
