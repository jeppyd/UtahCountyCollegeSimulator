system: housing
mechanisms:
  housing.bedroom:
    label: Bedroom-mates
    target: [edge.liking, edge.closeness, edge.conflict]
    sources: [room, conscientiousness, sleep_hours]
    form: "Each night, people sharing a bedroom (not spouses) talk before sleep with probability talk_rate: one more at-home conversation (the usual valence and length) on top of their daytime time at home, so bedroom-mates grow close faster. Clearly mismatched habits sour it: valence − tidy·max(0, |Δ conscientiousness (z)| − 1.2) − sleep·max(0, |Δ sleep hours| − 2)."
    params:
      talk_rate: {value: 0.6, range: [0.2, 0.9]}
      tidy: {value: 0.45, range: [0.0, 0.9]}
      sleep: {value: 0.35, range: [0.0, 0.7]}
    timescale: day
    evidence: hypothetical
    desc: "Sharing a room adds unplanned time together (late-night talks) and small daily frictions (tidiness, bedtimes). No local survey measures roommate closeness or conflict; the strengths are plausible guesses, chosen so bedroom-mates end a semester somewhat closer on average than apartment-mates, with more falling-outs among badly matched pairs."
    refs: ["Shook & Fazio (2008) Psychol Sci: interracial roommate pairs — roommate relationships form fast but are fragile", "Erb et al. (2014) J College Student Development: roommate conflict and satisfaction in first-year housing"]
