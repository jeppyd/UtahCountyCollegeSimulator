# Calendar occasions (engine/systems/environment.py plans them from config/calendar/*.yaml on their days, origin
# "calendar"; the occasions system resolves who goes like any open occasion). Fields: see 00_core.yaml and
# 10_occasions.yaml. Bases are rough fits to public attendance figures (noted per kind) and hypothetical.
occasions:
  football_game:
    label: BYU home football game
    where: stadium
    start: "19:00"
    dur: 210
    open: true
    social: true
    category: sports
    rate: 0.35
    talk_h: 0.4
    act: venue
    cost: 0              # students get in on an all-sports pass
    # LaVell Edwards Stadium seats ~62,000; the student section holds several thousand of BYU's ~33,000 students, so
    # roughly a quarter of students at a typical home game (hypothetical fit). The audience is BYU students only:
    # community fans are not modelled as attendees.
    audience:
      - {var: school, op: "==", value: BYU}
      - {var: enrolled, op: "==", value: true}
    base: -1.4
    interest: {fd_sports_game: 0.8, sports: 0.5, extraversion: 0.3, drive_fun: 0.6}
    capacity: -1
  devotional:
    label: BYU devotional or forum
    where: stadium       # the Marriott Center arena
    start: "11:05"
    dur: 50
    open: true
    social: false
    category: religion
    rate: 0.15
    talk_h: 0.2
    act: campus
    cost: 0
    # The Marriott Center seats ~18,000; in-person attendance is a few thousand on a typical Tuesday (many watch
    # online), so ~10% of BYU students (hypothetical fit). No classes are scheduled during the devotional hour.
    audience:
      - {var: school, op: "==", value: BYU}
      - {var: enrolled, op: "==", value: true}
    base: -3.0
    interest: {attend_rate: 1.0, imp_spirituality: 0.5, faith_belief: 0.6}
    capacity: 18000
  stadium_of_fire:
    label: Stadium of Fire
    where: stadium
    start: "20:00"
    dur: 180
    open: true
    social: true
    category: civic
    rate: 0.3
    talk_h: 0.4
    act: venue
    cost: 45             # tickets roughly $30–$100
    # ~45,000 attend the America's Freedom Festival concert and fireworks; as a share of young Provo–Orem adults about
    # one in eight (hypothetical).
    audience:
      - {var: age, op: between, value: [16, 40]}
    base: -2.8
    interest: {fd_concert: 0.6, extraversion: 0.3, drive_fun: 0.6}
    capacity: 60000
  basketball_game:
    label: BYU men's basketball game
    where: stadium       # the Marriott Center arena
    start: "19:00"
    dur: 150
    open: true
    social: true
    category: sports
    rate: 0.3
    talk_h: 0.3
    act: venue
    cost: 0              # students get in on an all-sports pass
    # The Marriott Center seats ~18,000; the student section ("the ROC") holds a few thousand at a well-attended game,
    # so roughly one in fifteen of BYU's students at a typical home game (hypothetical fit). BYU students only.
    audience:
      - {var: school, op: "==", value: BYU}
      - {var: enrolled, op: "==", value: true}
    base: -2.4
    interest: {fd_sports_game: 0.8, sports: 0.5, extraversion: 0.3, drive_fun: 0.6}
    capacity: 18000
  uvu_basketball_game:
    label: UVU men's basketball game
    where: stadium       # the UCCU Center
    start: "19:00"
    dur: 150
    open: true
    social: true
    category: sports
    rate: 0.25
    talk_h: 0.3
    act: venue
    cost: 0              # students get in with their UVU card
    # The UCCU Center seats ~8,500 and is rarely full; UVU is a commuter campus, so a small share of its students go
    # to a typical home game (hypothetical, ~3%). UVU students only.
    audience:
      - {var: school, op: "==", value: UVU}
      - {var: enrolled, op: "==", value: true}
    base: -3.3
    interest: {fd_sports_game: 0.8, sports: 0.5, extraversion: 0.3, drive_fun: 0.6}
    capacity: 8500
