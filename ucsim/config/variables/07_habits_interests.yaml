entity: person
defaults: {kind: habit, dtype: f4, update: weekly, evidence: empirical, flags: [filter, chart, map]}
variables:
  sleep_hours:
    label: Sleep (hours/night)
    range: [3, 12]
    units: hours
    update: daily
    init: "copula provostats.sleep_hours"
    source: [provostats]
    flags: [filter, chart, map, timeseries]
    desc: "Hours actually slept in the last day (6 am to 6 am, naps included), from the hour-by-hour day (engine/systems/sleep.py): when they went to bed, how long it took to fall asleep, and when an alarm, a class or a shift got them up. The starting value is their usual amount (ProvoStats), which stays their sleep need."
  chronotype:
    label: Night-owl lean
    kind: trait
    units: hours
    range: [-4, 5]
    update: static
    evidence: literature
    group: sleep
    desc: "How much later than the typical person their body clock runs, in hours (negative: an early bird). It shifts when they get sleepy and when they're most up for going out. Younger adults run latest (Roenneberg et al. 2004); conscientious people lean earlier and sensation seekers, gamers and heavy phone users later (Tsaousis 2010; Tonetti et al. 2010); marriage and children pull schedules earlier."
    init: "engine/systems/sleep.py: from age, conscientiousness, sensation seeking, extraversion, gaming, social media, marriage and children, plus a personal part"
    source: [model]
  bedtime:
    label: Fell asleep (last night)
    kind: state
    units: hours
    range: [18, 34]
    update: daily
    evidence: structural
    group: sleep
    desc: "When they last fell asleep for the night, as hours after midnight of the evening before (23.5 = 11:30 pm, 25 = 1 am, 27 = 3 am)."
    init: "engine/systems/sleep.py"
    source: [model]
  wake_time:
    label: Woke up (this morning)
    kind: state
    units: hours
    range: [3, 15]
    update: daily
    evidence: structural
    group: sleep
    desc: "When they last got up in the morning (7.5 = 7:30 am)."
    init: "engine/systems/sleep.py"
    source: [model]
  late_nights_week:
    label: Late nights / week
    kind: habit
    units: nights
    range: [0, 7]
    update: daily
    evidence: structural
    group: sleep
    desc: "Nights in the last week they were still out or up with people after midnight (an average that fades over about a week)."
    init: "engine/systems/sleep.py"
    source: [model]
  workouts_week:
    label: Workouts / week
    range: [0, 14]
    init: "copula provostats.workouts_week"
    source: [provostats]
  social_media_hours:
    label: Social media (hours/day)
    range: [0, 14]
    init: "copula college_life.social_media_hours"
    source: [college-life]
  soda_shop_week:
    label: Soda-shop visits / week
    range: [0, 14]
    desc: Swig/Sodalicious-type dirty-soda shop visits — a Utah County social ritual and casual date venue.
    init: "copula provostats.soda_shop_per_week"
    source: [provostats]
  coffee:
    label: Coffee use
    dtype: u1
    range: [0, 3]
    ordinal: [never, rarely, occasionally, often]
    update: monthly
    desc: Coffee consumption (prohibited by the Word of Wisdom as currently taught). Peer-influenced; a canonical intervention target.
    init: "copula culture.freq_coffee"
    source: [culture-lifestyle]
    flags: [filter, chart, map, timeseries]
  tea:
    label: Tea use
    dtype: u1
    range: [0, 3]
    ordinal: [never, rarely, occasionally, often]
    update: monthly
    init: "copula culture.freq_tea"
    source: [culture-lifestyle]
  alcohol:
    label: Alcohol use
    dtype: u1
    range: [0, 3]
    ordinal: [never, rarely, occasionally, often]
    update: monthly
    init: "copula culture.freq_alcohol"
    source: [culture-lifestyle]
    flags: [filter, chart, map, timeseries]
  r_movies:
    label: R-rated movies
    dtype: u1
    range: [0, 3]
    ordinal: [never, rarely, occasionally, often]
    update: monthly
    init: "copula culture.freq_r_movies"
    source: [culture-lifestyle]
  dancing:
    label: Goes dancing
    dtype: u1
    range: [0, 3]
    ordinal: [never, rarely, sometimes, often]
    desc: Country/latin social dancing (e.g., Peak Nights, Tippin' Point, Grove Station) — a major singles mixing context.
    init: "copula college_life.dancing_freq"
    source: [college-life]
  hikes:
    label: Hiking
    dtype: bool
    update: static
    init: "copula college_life.hob_hiking"
    source: [college-life]
  gaming:
    label: Video gaming
    dtype: bool
    update: static
    init: "copula college_life.hob_gaming"
    source: [college-life]
  sports:
    label: Sports
    dtype: bool
    update: static
    init: "copula college_life.hob_sports"
    source: [college-life]
  music_maker:
    label: Plays music / sings
    dtype: bool
    update: static
    init: "copula college_life.hob_instruments | hob_singing"
    source: [college-life]
  reading:
    label: Reading
    dtype: bool
    update: static
    init: "copula college_life.hob_reading"
    source: [college-life]
  cooking:
    label: Cooking/baking
    dtype: bool
    update: static
    init: "copula college_life.hob_cooking"
    source: [college-life]
  outdoors:
    label: Camping/climbing
    dtype: bool
    update: static
    init: "copula college_life.hob_camping | hob_climbing"
    source: [college-life]
  arts:
    label: Art/photo/writing
    dtype: bool
    update: static
    init: "copula college_life.hob_art | hob_photo | hob_writing"
    source: [college-life]
  swiftie:
    label: Swiftie
    dtype: bool
    update: static
    init: "copula college_life.swiftie"
    source: [college-life, dating]
  pickleball:
    label: Plays pickleball
    dtype: bool
    update: weekly
    desc: Example diffusing cultural practice (complex contagion through friend networks). Seeded small at start.
    evidence: hypothetical
