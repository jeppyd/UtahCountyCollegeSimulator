# World configuration: institutional targets, flows and environment.
# Numbers marked (approx) are from general knowledge of public institutional reporting and
# should be verified against current BYU/UVU fact books; they are calibration targets, not data.
start_date: "2026-08-24"     # Monday of BYU/UVU fall-semester start (approx)
default_scale: 0.3           # 1.0 ≈ 60k agents; group sizes (wards, classes, units) stay realistic at any scale

population:                  # counts at scale 1.0
  byu:
    students: 35000          # BYU fall 2025 headcount 37,337; modeled ~94% (excludes evening/online-only)
    married_share: 0.25      # (approx) ~1 in 4 BYU students married
    grad_share: 0.09
    male_share: 0.50
    lds_share: 0.985
    freshman_share: 0.16
    class_mix: {freshman: 0.17, sophomore: 0.19, junior: 0.22, senior: 0.33, graduate: 0.09}   # (approx) BYU Y-Facts pattern: large senior class
    with_parents_share: 0.06
  uvu:
    students: 16000          # in-scope subset of UVU's fall 2025 headcount 48,670: excludes concurrent-enrollment, online-only and most distant commuters
    married_share: 0.30      # (approx)
    male_share: 0.52
    lds_share: 0.72          # (assumption) lower than BYU; no ecclesiastical endorsement requirement
    with_parents_share: 0.33 # (assumption) many UVU students live with family in Utah County
    class_mix: {freshman: 0.30, sophomore: 0.24, junior: 0.18, senior: 0.25, graduate: 0.03}   # (approx) open-admission: big first year
    active_tilt: 0.55        # odds multiplier on 'active' vs survey (survey over-represents active members)
  young_adults: 6000         # non-student 18-30s embedded in YSA wards / workplaces
  faculty: 1500
  staff: 1000
  community: 1000            # bishops, ward leaders, local family members, employers

flows:                       # per year at scale 1.0
  byu_freshmen: 5400         # arrive at fall start
  byu_rm_returners: 3000     # returned missionaries enrolling; arrive spread over the year
  uvu_new_students: 4000
  byu_transfer: 600
  byu_grad_and_transfer: 1800  # new graduate students (~70%) and older transfers each fall; most married (assumption: BYU ≈3.2k grad students, 2-yr programs)

mission:
  male_age: 18
  female_age: 19
  male_months: 24
  female_months: 18
  early_return_rate: 0.08    # (assumption; literature on early-returned missionaries suggests a minority)
  # Missionaries from this ecosystem serving when the run starts (full scale). Calibrated to the flow equilibrium
  # of the call hazard (calls/yr × mean service ≈ 5.8k × 1.85 yr; scripts/accounting.py) so the stock does not
  # drift upward for two years after the start, as it did when only BYU returners were seeded.
  serving_pool: 10500
  serving_pool_male_share: 0.53
  serving_pool_school_mix: {BYU: 0.78, UVU: 0.19, none: 0.03}

calendar:                    # month-day boundaries (approx BYU calendar)
  byu_terms:
    - {name: Fall, start: "08-24", end: "12-17"}
    - {name: Winter, start: "01-07", end: "04-22"}
    - {name: Spring, start: "04-29", end: "06-18"}
    - {name: Summer, start: "06-23", end: "08-12"}
  uvu_terms:
    - {name: Fall, start: "08-24", end: "12-16"}
    - {name: Spring, start: "01-07", end: "05-01"}
    - {name: Summer, start: "05-11", end: "08-08"}
  spring_summer_presence: 0.45   # share of single BYU undergrads who stay in Provo for spring/summer
  lease_turnover: ["04-30", "08-20"]

climate:                     # Provo monthly mean daily high °F (approx normals)
  high_f: [38, 44, 54, 61, 71, 82, 91, 89, 79, 65, 50, 39]

economy:
  unemployment: 0.032
  min_wage_campus: 12.5
  rent_market_adjust: 0.15    # monthly rent response per unit vacancy gap

tuition:
  byu_lds_semester: 3500      # (approx)
  byu_nonlds_semester: 7000   # (approx)
  uvu_semester: 3100          # (approx) resident full-time

history:                     # per-person snapshots for flows and trajectories (see engine/systems/history.py)
  every_days: 14
  categorical: [rel_status, activity, mission_status, living, school, enrolled, class_standing, academic_standing,
                employed, faith_crisis, depressive_episode, app_user, temple_recommend, affiliation, investigating,
                top_priority, coping_strategy, intention]
  numeric: [loneliness, mood, stress, belonging, anxiety, self_esteem, purpose, life_satisfaction, faith_belief,
            faith_certainty, religious_identity, attend_rate, n_friends, n_close_friends, dates_30d, romantic_longing,
            relationship_satisfaction, financial_stress, rent_burden, savings, gpa, coffee, alcohol, outsider,
            service_attend, n_groups, perceived_support, expect_social, expect_accept, self_eff_academic, social_events_month,
            drive_connection, drive_partnership, coping_need, routine_strength, memory_tone]
